[project]
name = "agrocebada-uv"
version = "0.1.0"
description = "AgroCebada: análisis reproducible, experimentos y futura inferencia"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.4.4",
    "pandas==2.2.3",
    "scipy==1.18.0",
    "scikit-learn==1.9.1",
]

[dependency-groups]
notebooks = [
    "matplotlib==3.11.2",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
    "jupyterlab>=4.4,<5",
]
geo = [
    "rasterio>=1.4,<2",
    "shapely==2.1.2",
    "pyproj==3.8.0",
    "pyshp==3.1.6",
]
colab = ["gdown>=5.2,<6", "matplotlib==3.11.2"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
